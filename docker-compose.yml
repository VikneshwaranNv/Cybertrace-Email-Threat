services:
  cybertrace-soc:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybertrace-soc-platform:latest
    container_name: cybertrace-soc-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GMAIL_AUTO_SYNC_ENABLED=false
      - GEOIP_PROVIDER=ipwhois
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
